# Modified for NativeCmpKit migration (2026-10-24); source module paths retained.
name: Bug Report
description: Report a bug in NativeCmpKit
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: List the steps to reproduce the issue
      placeholder: 1. Add component X to Android/iOS/Desktop...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
    validations:
      required: true

  - type: dropdown
    id: module
    attributes:
      label: Module
      description: Which Kira module is affected?
      options:
        - kira-ui
        - kira-file-picker
        - kira-file-picker-coil
        - kira-io
        - kira-camera-picker
        - kira-share
        - kira-webview
        - kira-permissions
        - kira-cupertino-icons
        - kira-core
        - other
    validations:
      required: true

  - type: input
    id: other_module
    attributes:
      label: Specify Other Module (if you selected "other" above)
      description: Only fill this if you chose "other" in the Module dropdown.
      placeholder: e.g., kira-geo, kira-navigation

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android
        - iOS
        - Desktop
        - Web
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Commit or Library Version
      description: Provide the NativeCmpKit release version or checkout SHA.
      placeholder: NativeCmpKit main at <commit SHA>
    validations:
      required: true

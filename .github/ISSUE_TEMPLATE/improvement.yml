# Modified for NativeCmpKit migration (2026-10-24); source module paths retained.
name: Improvement
description: Suggest improvements to existing NativeCmpKit functionality
title: "[Improvement]: "
labels: ["improvement"]
body:
  - type: textarea
    id: context
    attributes:
      label: Current Behavior
      description: What’s happening now?
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: Suggested Change
      description: How should it be improved?
    validations:
      required: true

  - type: dropdown
    id: module
    attributes:
      label: Module
      description: Which Kira module should change?
      options:
        - kira-ui
        - kira-file-picker
        - kira-file-picker-coil
        - kira-io
        - kira-camera-picker
        - kira-share
        - kira-webview
        - kira-permissions
        - kira-cupertino-icons
        - kira-core
        - other
    validations:
      required: true

  - type: input
    id: other_module
    attributes:
      label: Specify Other Module (if you selected "other" above)
      description: Only fill this if you chose "other" in the Module dropdown.
      placeholder: e.g., kira-geo, kira-navigation

  - type: dropdown
    id: area
    attributes:
      label: Area of Improvement
      options:
        - UI Component
        - Gradle/Build
        - Documentation
        - Performance
    validations:
      required: true

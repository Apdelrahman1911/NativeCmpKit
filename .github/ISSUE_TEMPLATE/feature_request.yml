# Modified for NativeCmpKit migration (2026-10-24); source module paths retained.
name: Feature Request
description: Suggest a new NativeCmpKit feature
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Why is this feature needed for cross-platform Compose?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: Describe your idea (API, UI component, etc.)
    validations:
      required: true

  - type: dropdown
    id: module
    attributes:
      label: Module
      description: Which Kira module should include this feature?
      options:
        - kira-ui
        - kira-file-picker
        - kira-file-picker-coil
        - kira-io
        - kira-camera-picker
        - kira-share
        - kira-webview
        - kira-permissions
        - kira-cupertino-icons
        - kira-core
        - other
    validations:
      required: true

  - type: input
    id: other_module
    attributes:
      label: Specify Other Module (if you selected "other" above)
      description: Only fill this if you chose "other" in the Module dropdown.
      placeholder: e.g., kira-geo, kira-navigation

  - type: dropdown
    id: target
    attributes:
      label: Target Platform(s)
      options:
        - Android
        - iOS
        - Desktop
        - Web
    validations:
      required: true
